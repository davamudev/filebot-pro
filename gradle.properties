# Gradle
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Application
app.name=FileBot Pro
app.id=filebot-pro
app.version=1.1.0
app.vendor=DaVaMu
app.description=Organize and rename your movies, TV shows and anime, and fetch subtitles and artwork.
app.mainClass=dev.davamu.filebotpro.Main
app.identifier=dev.davamu.filebotpro
# Contact e-mail for the Maintainer field of the .deb package (Maintainer: <vendor> <e-mail>)
app.maintainerEmail=contacto@davamu.dev

# Documentation site (help menu, F1, welcome screen)
app.website=https://filebotpro.davamu.dev

# New release notice: update.xml (<revision>, <version>, <title>, <message>, <download>) attached to every release by
# release.yml. Leave empty to disable the update check
app.updateUrl=https://github.com/davamudev/filebot-pro/releases/latest/download/update.xml
