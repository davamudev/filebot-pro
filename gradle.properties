# Gradle
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Application
app.name=FileBot Pro
app.id=filebot-pro
app.version=1.0.0
app.vendor=DaVaMu
app.description=Organize and rename your movies, TV shows and anime, and fetch subtitles and artwork.
app.mainClass=dev.davamu.filebotpro.Main
app.identifier=dev.davamu.filebotpro
# Contact e-mail for the Maintainer field of the .deb package (Maintainer: <vendor> <e-mail>)
app.maintainerEmail=

# Documentation site (help menu, F1, welcome screen)
app.website=https://filebotpro.davamu.dev

# Leave empty to disable the update check (expects an update.xml with <revision>, <title>, <message>, <download>, <discussion>)
app.updateUrl=
