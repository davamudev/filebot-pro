# Regenerates the detection data indexes (movies, series, subtitles, anime, discs), publishes them with their manifest.json
# as assets of the "data" pre-release, which installed versions download about once a week (DataUpdate, app.dataUrl), and
# once a month opens or updates a pull request when they changed, so that the next release bundles them (every weekly
# commit would add several MB of binary data to the history).
# Runs every Monday and on demand (Actions > Update data > Run workflow, which always updates the pull request).
name: Update data

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Regenerate the indexes
        run: ./gradlew --no-daemon updateData

      # assets are replaced in place and the manifest goes last: clients that fetch an index while it is being replaced fail
      # the checksum check and retry the next day
      - name: Publish the indexes to the data pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_SIGNING_KEY: ${{ secrets.DATA_SIGNING_KEY }}
        run: |
          data=src/main/resources/dev/davamu/filebotpro/data
          # the manifest carries the checksums of the indexes, so it is signed (Ed25519) and the application verifies the
          # signature with the public key built into DataUpdate
          if [ -z "$DATA_SIGNING_KEY" ]; then
            echo "The DATA_SIGNING_KEY secret is missing." >&2
            exit 1
          fi
          key="$(mktemp)"
          printf '%s\n' "$DATA_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$data/manifest.json" -out "$RUNNER_TEMP/manifest.json.sig"
          rm -f "$key"
          if ! gh release view data > /dev/null 2>&1; then
            gh release create data --prerelease --latest=false --target develop --title "Detection data" \
              --notes "Detection data indexes regenerated every week by the Update data workflow. FileBot Pro downloads the ones that changed about once a week, see the manifest.json. Not a release of the application."
          fi
          gh release upload data "$data"/*.xz --clobber
          gh release upload data "$RUNNER_TEMP/manifest.json.sig" --clobber
          gh release upload data "$data/manifest.json" --clobber
          grep -E '"(format|date)"' "$data/manifest.json"

      # scheduled runs only on the first Monday of the month, manual runs always
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%-d)" -gt 7 ]; then
            echo "The pull request is only updated on the first Monday of the month."
            exit 0
          fi
          if [ -z "$(git status --porcelain src/main/resources)" ]; then
            echo "The indexes are up to date."
            exit 0
          fi
          git status --short src/main/resources
          branch="chore/update-data"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src/main/resources
          git commit -m "chore(data): update the bundled indexes"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base develop --head "$branch" \
              --title "chore(data): update the bundled indexes" \
              --body "Indexes regenerated by the Update data workflow from Wikidata, the anime-offline-database and TheDiscDB."
          fi
