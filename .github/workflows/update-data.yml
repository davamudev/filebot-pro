# Regenerates the bundled indexes (movies, series, subtitles, anime, discs) and opens a pull request when they changed.
# Runs on the first day of every month and on demand (Actions > Update data > Run workflow).
name: Update data

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Regenerate the indexes
        run: ./gradlew --no-daemon updateData

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/main/resources)" ]; then
            echo "The indexes are up to date."
            exit 0
          fi
          git status --short src/main/resources
          branch="chore/update-data"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src/main/resources
          git commit -m "chore(data): update the bundled indexes"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base develop --head "$branch" \
              --title "chore(data): update the bundled indexes" \
              --body "Indexes regenerated by the Update data workflow from Wikidata, the anime-offline-database and TheDiscDB."
          fi
