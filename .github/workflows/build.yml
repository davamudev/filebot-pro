# Compile check, smoke test, docker build and docs build on every push to develop / master and on every pull request (releases: release.yml)
name: Build

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - run: ./gradlew --no-daemon compileJava

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - run: ./gradlew --no-daemon installDist

      - name: Start and rename offline
        run: |
          export FILEBOT_PRO_OPTS="-Dapplication.dir=$RUNNER_TEMP/data"
          bin=build/install/filebot-pro/bin/filebot-pro
          $bin -version
          $bin -script fn:sysinfo
          mkdir samples && touch "samples/Example.Movie.2020.mkv"
          $bin -rename samples --db file --action test --format "{fn}-renamed"

      - name: Command line end-to-end checks
        run: packaging/tests/e2e-cli.sh

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [headless, gui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: filebot-pro:${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - run: docker run --rm --entrypoint /opt/filebot-pro/bin/filebot-pro filebot-pro:${{ matrix.target }} -version

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
      - run: npm run build
