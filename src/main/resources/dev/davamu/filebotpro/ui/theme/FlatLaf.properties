#
# FileBot Pro look and feel: shared customizations on top of the FlatLaf defaults.
# FlatLightLaf.properties and FlatDarkLaf.properties in this package define the light and dark palettes.
#

#---- brand ----

@accentColor = #F97316


#---- custom delegates (micro-animations, combo box focus) ----

ButtonUI = dev.davamu.filebotpro.ui.theme.AnimatedButtonUI
ToggleButtonUI = dev.davamu.filebotpro.ui.theme.AnimatedToggleButtonUI
ComboBoxUI = dev.davamu.filebotpro.ui.theme.AppComboBoxUI


#---- geometry ----

Component.arc = 10
Component.focusWidth = 0
Component.innerFocusWidth = 0
Button.arc = 10
Button.margin = 4,14,4,14
Button.minimumWidth = 64
Button.iconTextGap = 6
ToggleButton.margin = 4,12,4,12
CheckBox.arc = 6
TextComponent.arc = 8
ProgressBar.arc = 999
ProgressBar.horizontalSize = 160,6

ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 3,3,3,3
ScrollBar.trackArc = 999
ScrollBar.showButtons = false

List.selectionArc = 8
List.selectionInsets = 0,4,0,4
Tree.selectionArc = 6
Tree.selectionInsets = 0,2,0,2
ComboBox.selectionArc = 6
ComboBox.padding = 3,8,3,8
MenuItem.selectionArc = 6
MenuItem.selectionInsets = 0,4,0,4
Menu.selectionArc = 6
PopupMenu.borderCornerRadius = 10
Popup.borderCornerRadius = 10
ToolTip.borderCornerRadius = 8

Table.rowHeight = 26
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0,0
TableHeader.height = 28
TableHeader.separatorColor = $Component.borderColor
TableHeader.bottomSeparatorColor = $Component.borderColor

TabbedPane.tabHeight = 34
TabbedPane.tabArc = 8
TabbedPane.tabSelectionHeight = 3
TabbedPane.tabSelectionArc = 999
TabbedPane.tabInsets = 4,14,4,14
TabbedPane.showTabSeparators = false

SplitPane.dividerSize = 7
SplitPaneDivider.style = plain

TitlePane.unifiedBackground = true
TitlePane.menuBarEmbedded = true


#---- semantic colors used by FileBot Pro components (palette files override these) ----

App.success = #16A34A
App.warning = #D97706
App.error = #DC2626


#---- style classes (component.putClientProperty("FlatLaf.styleClass", "accent")) ----

[style]Button.accent = \
	background: #F97316; \
	foreground: #FFFFFF; \
	borderColor: #F97316; \
	hoverBorderColor: #EA580C; \
	focusedBorderColor: #FDBA74; \
	focusedBackground: #F97316; \
	hoverBackground: #EA580C; \
	pressedBackground: #C2410C; \
	borderWidth: 1; \
	font: $semibold.font

[style]Button.ghost = \
	buttonType: borderless; \
	hoverBackground: $App.ghostHover; \
	pressedBackground: $App.ghostPressed

[style]ToggleButton.ghost = \
	buttonType: borderless; \
	hoverBackground: $App.ghostHover; \
	pressedBackground: $App.ghostPressed; \
	selectedBackground: $App.ghostSelected

[style].secondaryText = \
	foreground: $Label.disabledForeground


#---- section titles instead of boxed groups ----

TitledBorder.border = 0,0,0,0
TitledBorder.titleColor = $Label.foreground
TitledBorder.font = $semibold.font
TitledBorder.titleMargins = 0,0,6,0


#---- rounded scroll panes (lists, tables, text areas) ----

ScrollPane.arc = 10


#---- breathing room inside lists and trees (first row must not touch the rounded border) ----

List.border = 4,0,4,0
Tree.border = 4,4,4,4
