# Application (tokens are replaced by Gradle, see build.gradle.kts)
application.name: @{application.name}
application.id: @{application.id}
application.version: @{application.version}
application.revision: @{application.revision}
application.commit: @{application.commit}
application.vendor: @{application.vendor}

# Update descriptor (empty = update check disabled)
update.url: @{update.url}

# Documentation site
link.website: @{application.website}/
link.app.help: @{application.website}/
link.intro: @{application.website}/getting-started/first-rename/
link.format: @{application.website}/formats/syntax/
link.faq: @{application.website}/help/faq/
link.help: @{application.website}/help/troubleshooting/

# API keys (api-keys.properties or FILEBOT_PRO_APIKEY_* environment variables at build time, -Dapikey.<name>=... at runtime)
# omdb and google.geocode are never embedded, users add their own key to the api-keys.properties in the user data folder
apikey.fanart.tv: @{apikey.fanart.tv}
apikey.themoviedb: @{apikey.themoviedb}
apikey.thetvdb: @{apikey.thetvdb}
apikey.acoustid: @{apikey.acoustid}
apikey.anidb: @{apikey.anidb}
apikey.opensubtitles: @{apikey.opensubtitles}
